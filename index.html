<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Live Forex Rates</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <span class="mark">FX</span>
    <span class="tagline">Live interbank rates, streamed from MT4</span>
  </div>
</header>

<main class="wrap">
  <section class="status-row">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">connecting…</span>
    <span class="asof" id="asOf"></span>
  </section>

  <table class="price-table">
    <thead>
      <tr>
        <th>Pair</th>
        <th>Bid</th>
        <th>Ask</th>
      </tr>
    </thead>
    <tbody id="commodityRows">
      <tr><td colspan="3" class="group-heading">Commodities</td></tr>
      <tr><td colspan="3" class="empty">Waiting for price feed…</td></tr>
    </tbody>
    <tbody id="forexRows">
      <tr><td colspan="3" class="group-heading">Forex</td></tr>
      <tr><td colspan="3" class="empty">Waiting for price feed…</td></tr>
    </tbody>
  </table>

  <p class="note">Rates update in real time from a live MetaTrader 4 terminal. For reference only — not an offer to trade.</p>

  <section class="chart-section">
    <h2 class="chart-heading">XAUUSD Chart</h2>
    <div class="tradingview-widget-container">
      <div id="tradingview_xauusd"></div>
    </div>
  </section>
</main>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
  new TradingView.widget({
    "width": "100%",
    "height": 420,
    "symbol": "OANDA:XAUUSD",
    "interval": "15",
    "timezone": "Etc/UTC",
    "theme": "dark",
    "style": "1",
    "locale": "en",
    "toolbar_bg": "#11161f",
    "enable_publishing": false,
    "hide_top_toolbar": false,
    "hide_legend": false,
    "save_image": false,
    "container_id": "tradingview_xauusd"
  });
</script>

<footer class="site-footer">
  <div class="wrap">Powered by MT4 → Python bridge</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
